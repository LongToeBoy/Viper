[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "viper"
version = "0.1.0"
description = "Cross-platform visual application designer for Python apps"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pywebview>=6.2.1; sys_platform == 'win32'"]

[project.scripts]
viper = "viper.main:main"
viper-run = "viper.runtime:main"

[tool.setuptools.packages.find]
include = ["viper*"]

[tool.setuptools.package-data]
viper = ["assets/*.html", "assets/*.css", "assets/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
